name: TianYing Update Rules
on: 
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '🧪 注入一次失败，验证失败告警链路（只建 issue，不发布任何产物）'
        type: boolean
        default: false
  schedule:
    # 每日一次：UTC 00:17 = 北京时间 08:17
    # 用 17 分而非整点，避开 GitHub 调度高峰（整点前后定时任务常被推迟十几分钟）
    - cron: '17 0 * * *'

# 定时与手动触发可能重叠，两个实例同时 push 会互相顶掉
concurrency:
  group: update-rules
  cancel-in-progress: false
    
jobs:
  update:
    runs-on: ubuntu-latest
    # 卡住的步骤最多耗 40 分钟就中止，而不是默认的 6 小时
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write
      issues: write          # 失败时自动开 issue 需要

    steps:
      # 第三方 action 一律钉 commit SHA（tag 可被上游重指，等于把仓库交给别人）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # 纯函数单测：不依赖产物、秒级，语义层（valid_domain / 域名后缀匹配 /
      # 镜像 URL 解析）改错时立刻红，而不是等到 40 分钟后产物对不上
      - name: Unit Tests
        run: python -m unittest discover -s tests -v

      # 🧪 失败告警链路自测：告警代码平时永远不执行，只有在出事时才跑，
      #    所以必须能被主动触发一次。手动 dispatch 勾上 simulate_failure 即可。
      #    用 github.event.inputs 而不是 inputs 上下文：前者对 workflow_dispatch 恒可用。
      - name: Simulate Failure
        if: ${{ github.event.inputs.simulate_failure == 'true' }}
        run: |
          echo "::error::模拟失败（simulate_failure=true）：用于验证 Report Failure 是否真的建出 issue"
          exit 1

      - name: Download Rules
        # 传入令牌：dl.py 的 GitHub API 兜底通道不再走匿名（60 次/小时限额）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ./data/python/dl.py

      - name: Merge Rules
        run: python ./data/python/merge.py

      - name: Generate dns Rules
        run: python ./data/python/filter-dns.py

      # 8 种派生格式一次生成：三个域名集各构建一次，写法全部来自 formats.py。
      # 以前是 8 个脚本各自读一遍 5.6 MB 的 dns.txt、各写一份循环。
      - name: Generate Derivative Formats
        run: python ./data/python/pipeline.py

      # ==============================================
      # 🛡️ 质量自检闸门：0 重复 / 0 父子域冗余 / 分区自洽，
      #    不合格 exit 1，问题不流到线上
      # ==============================================
      - name: Quality Check
        run: python ./data/python/check-quality.py

      # ==============================================
      # 🔍 格式一致性：8 种拦截产物对同一域名的判定必须一致。
      #    历史上 qx 漏拦 1.4 万子域、hosts 漏拦 1.4 万、dnsmasq 不认 address=，
      #    全靠"人记得跑 verify"才发现。现在由 CI 强制，改坏当场红。
      # ==============================================
      - name: Verify Format Consistency
        run: python ./data/python/verify-fixes.py

      - name: Update Title & ReadMe
        run: |
          python ./data/python/title.py
          python ./data/python/clean-readme.py
          # 更新历史从 git log 生成，自动跳过本工作流的例行提交
          python ./data/python/changelog.py

      - name: Update Trend Chart
        run: python ./data/python/trend.py

      # ==============================================
      # 无变化不提交（否则定时运行的 git commit 会因
      # nothing to commit 退出码 1 把整个工作流判为失败）
      # ==============================================
      - name: Git Push
        id: push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add --all
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 规则无变化，跳过提交"
          else
            git commit -m "✅ 规则自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ==============================================
      # 🏷️ 动态徽章：需配置仓库 Variable GIST_ID +
      #    Secret GIST_SECRET，未配置时自动跳过
      # ==============================================
      - name: Prepare Badge Message
        run: echo "BADGE_MSG=$(python ./data/python/badge_msg.py)" >> "$GITHUB_ENV"

      - name: Update Badge
        if: ${{ vars.GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483  # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: tianying-stats.json
          label: 天影规则
          message: ${{ env.BADGE_MSG }}
          color: green
          namedLogo: github

      # ==============================================
      # 📊 运行摘要：条数直接写进 Job 首页，不用点开日志翻
      # ==============================================
      - name: Job Summary
        if: always()
        run: |
          {
            echo "## 📊 本次产物"
            echo ""
            echo "| 文件 | 条数 |"
            echo "| --- | ---: |"
            for f in dns.txt adblock.txt allow.txt hosts.txt dnsmasq.conf; do
              n=$(grep -vcE '^(#|!|\[|$)' "data/rules/$f" 2>/dev/null || true)
              echo "| $f | ${n:-读取失败} |"
            done
            echo ""
            # README 里的写法是「✅ **上游源状态**：20/20 全部下载成功」，
            # 状态与冒号之间夹着 **，旧正则 `上游源状态：[^<]*` 永远匹配不到，输出恒为空
            echo "上游源：$(grep -m1 '上游源状态' README.md 2>/dev/null | sed 's/.*\*\*：//')"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==============================================
      # 🚨 失败通知：定时任务挂了只在 Actions 页面可见，
      #    规则会静默停在几天前。失败时自动开 issue，
      #    已有同名 open issue 则追加评论。
      #
      #    用 gh CLI 而不是 curl 直调：JSON 组装、转义、错误码全交给 gh，
      #    它遇到 4xx/5xx 会以非零退出码结束。旧写法 `curl -sS ... > /dev/null`
      #    没有 -f，4xx 也返回 0，这一步会显示绿色但什么都没发生——
      #    专门为"失败可见"加的防线，在最需要它的时候是纸糊的。
      # ==============================================
      - name: Report Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
                       --search '自动创建 in:title' \
                       --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" \
              --body "再次失败：$RUN_URL"
            echo "↩️ 已追加到 issue #$existing"
          else
            body=$(printf '最近一次定时更新失败。\n\n运行记录：%s\n\n排查顺序：Job Summary 看各产物条数 → Download Rules 看哪个源挂了 → Quality Check / Verify Format Consistency 看是不是规则本身退化。' "$RUN_URL")
            # gh issue create 把 issue URL 打到 stdout（它不支持 --json），顺手打出来方便点进去
            url=$(gh issue create --repo "${{ github.repository }}" \
              --title "❌ 规则更新/校验失败（自动创建）" \
              --body "$body")
            echo "🆕 已创建失败 issue：$url"
          fi

      # 失败时把产物传一份，方便事后 diff 排查（成功时不传，省存储和时长）
      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rules-${{ github.run_id }}
          path: data/rules/
          retention-days: 7

      # ==============================================
      # 运行记录清理：保留最近 7 天 / 至少 5 条，
      # 便于回溯"某天规则为什么变化"（原设置只留 1 条，
      # 出事时完全无据可查）
      # ==============================================
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 5
