name: TianYing Update Rules
on: 
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

# 定时与手动触发可能重叠，两个实例同时 push 会互相顶掉
concurrency:
  group: update-rules
  cancel-in-progress: false
    
jobs:
  update:
    runs-on: ubuntu-latest
    # 卡住的步骤最多耗 40 分钟就中止，而不是默认的 6 小时
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Rules
        # 传入令牌：dl.py 的 GitHub API 兜底通道不再走匿名（60 次/小时限额）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ./data/python/dl.py

      - name: Merge Rules
        run: python ./data/python/merge.py

      - name: Generate dns Rules
        run: python ./data/python/filter-dns.py

      - name: Generate qx Rules
        run: python ./data/python/qx.py

      - name: Generate SmartDNS Rules
        run: python ./data/python/smartdns.py

      - name: Generate SmartDNS Whitelist
        run: python ./data/python/smartdns_whitelist.py

      - name: Generate Domain List
        run: python ./data/python/domain_list.py

      - name: Generate Hosts Rules
        run: python ./data/python/hosts.py

      - name: Generate Clash/Surge Rules
        run: |
          python ./data/python/clash.py
          python ./data/python/surge.py

      # ==============================================
      # 🛡️ 质量自检闸门：0 重复 / 0 父子域冗余 / 分区自洽，
      #    不合格 exit 1，问题不流到线上
      # ==============================================
      - name: Quality Check
        run: python ./data/python/check-quality.py

      - name: Update Title & ReadMe
        run: |
          python ./data/python/title.py
          python ./data/python/clean-readme.py

      - name: Update Trend Chart
        run: python ./data/python/trend.py

      # ==============================================
      # 无变化不提交（否则定时运行的 git commit 会因
      # nothing to commit 退出码 1 把整个工作流判为失败）
      # ==============================================
      - name: Git Push
        id: push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add --all
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 规则无变化，跳过提交"
          else
            git commit -m "✅ 规则自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ==============================================
      # 🏷️ 动态徽章：需配置仓库 Variable GIST_ID +
      #    Secret GIST_SECRET，未配置时自动跳过
      # ==============================================
      - name: Prepare Badge Message
        run: echo "BADGE_MSG=$(python ./data/python/badge_msg.py)" >> "$GITHUB_ENV"

      - name: Update Badge
        if: ${{ vars.GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: tianying-stats.json
          label: 天影规则
          message: ${{ env.BADGE_MSG }}
          color: green
          namedLogo: github

      # ==============================================
      # 运行记录清理：保留最近 7 天 / 至少 5 条，
      # 便于回溯"某天规则为什么变化"（原设置只留 1 条，
      # 出事时完全无据可查）
      # ==============================================
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 5
