name: Probe Dead Rules
# ============================================================
# 死规则周期体检：把「域名已不存在」的拦截规则识别出来，
# 写进 data/mod/dead.txt，日更流程会自动剔除它们。
#
# 为什么不放在日更工作流里：
#   域名消失是「周级」而不是「日级」变化。每周扫一遍够用，
#   日更只读结果（merge.py 读 dead.txt），不承担探测成本。
#
# 增量模式（2026-11-11 起）：
#   全量 22 万+ 条每周重探，时间全花在「上周刚验过活着」的域上。
#   改增量：新增域全探 + 存量按域名哈希稳定抽 10% 复核 + 旧死域全集复验，
#   快照文件 data/mod/probe-snapshot.txt 随 dead.txt 一起提交。
#   运行时间 35 分钟 → 10 分钟以内；首次运行快照缺失自动退化全量。
#
# 探测方式：UDP 直连 223.5.5.5 / 119.29.29.29，两台都返回
#   RCODE=3 才判死；网络错误率 >30% 或死域占比 >40% 自动中止
#   且不写盘（避免链路故障造成批量误删）。
# ============================================================
on:
  schedule:
    # 每周日 03:17 UTC = 北京时间 11:17（避开日更 00:17 UTC，两条流程不抢 git）
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      qps:
        description: '总请求速率上限（条/秒，默认 150，两台各 75；单台速率实测超过 ~150 会被公共 DNS 限流，反而更慢）'
        default: '150'
      limit:
        description: '只测前 N 条（留空 = 全量；调试用）'
        default: ''

concurrency:
  group: probe-dead
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      issues: write   # Report Failure 步骤 gh issue create 需要；缺了它会静默失败（run#3 教训）

    steps:
      # 浅克隆即可：commit/push 只需远端已有父提交（本仓库始终满足），
      # 本工作流不打 tag、不读 git log，完整历史纯属浪费 20 秒下载
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1

      # 产物缺失时探测无从下手（dead.txt 的输入是 dns.txt）
      - name: Check Inputs
        run: |
          test -f data/rules/dns.txt || {
            echo "::error::data/rules/dns.txt 不存在，先跑一次日更工作流"
            exit 1
          }
          echo "待探测：$(grep -cE '^\|\|' data/rules/dns.txt) 条"

      - name: Probe NXDOMAIN
        # 输入通过 env 传入，不直接拼进 shell（避免空值把命令搞坏）
        env:
          QPS: ${{ inputs.qps }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -eu
          # 增量模式：新增域全探 + 存量抽 10% + 旧死域复验，约 10 分钟内。
          # 快照缺失时脚本自动退化全量（首次运行/快照丢失都不用手动干预）。
          # 限速 + 分批冷却是硬性要求：不限速裸跑会触发公共 DNS 限流，
          # 实测 24.6 万条跑完错误率 63.9%（15.7 万条超时）。
          args=("--workers" "64" "--qps" "${QPS:-150}" "--batch" "30000" "--cooldown" "20" "--incremental")
          if [ -n "${LIMIT:-}" ]; then args+=("--limit" "$LIMIT"); fi
          # 一轮没跑完（错误率超限 / 配额耗尽）就先 continue 一轮：
          # 进度已落盘，抽样是域名哈希稳定的，续传抽的还是同一批，不浪费。
          if ! python ./data/python/probe-dead.py "${args[@]}"; then
            echo "::warning::首轮未达标，自动续传一轮"
            python ./data/python/probe-dead.py "${args[@]}"
          fi

      - name: Commit dead.txt
        run: |
          set -eu
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # 快照必须与 dead.txt 同代提交：快照决定下轮「新增域」的差集，
          # 只提交一半会让下一次探测口径错乱
          if git diff --quiet -- data/mod/dead.txt data/mod/probe-snapshot.txt; then
            echo "⏭️ dead.txt 与快照均无变化，跳过提交"
            exit 0
          fi
          git add data/mod/dead.txt data/mod/probe-snapshot.txt
          git commit -m "☠️ 死规则清单更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          # 与日更工作流存在竞态（run#3 教训：日更先推了 master，这里 push 被拒）：
          # push 前先 rebase 到远端最新，冲突概率极低（两流程写不同文件）
          git pull --rebase origin master
          git push

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## ☠️ 死规则体检"
            echo ""
            if [ -f data/mod/dead.txt ]; then
              echo "| 项目 | 值 |"
              echo "| --- | ---: |"
              echo "| dead.txt 条数 | $(grep -vcE '^(#|!|\[|$)' data/mod/dead.txt) |"
              echo "| 快照域数 | $(grep -vcE '^(#|!|\[|$)' data/mod/probe-snapshot.txt 2>/dev/null || echo '—') |"
              echo "| 当前 DNS 拦截 | $(grep -vcE '^(#|!|\[|$)' data/rules/dns.txt) |"
              echo ""
              echo "生成时间：$(grep -m1 '生成时间' data/mod/dead.txt | sed 's/^! //')"
              echo "探测口径：$(grep -m1 '探测口径' data/mod/dead.txt | sed 's/^! //')"
            else
              echo "⚠️ 未生成 dead.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          # body 走临时文件：bash printf 的 format 参数遇到多字节中文会报
          # "invalid format character"（run#4 实测），直接 printf 格式化不可靠。
          cat > /tmp/issue-body.md <<EOF
          死规则探测失败，dead.txt 未更新（日更流程继续使用上一次的清单）。

          运行记录：$RUN_URL

          常见原因：
          - 出站 UDP 53 被拦截 → 错误率超阈值，脚本主动中止（这是保护，不是故障）
          - DNS 服务器抽风 → 死域占比超 40%，脚本主动中止
          - 规则文件缺失 → 先跑一次日更工作流
          EOF
          url=$(gh issue create --repo "${{ github.repository }}" \
            --title "❌ 死规则体检失败（自动创建）" \
            --body-file /tmp/issue-body.md)
          echo "🆕 已创建 issue：$url"
